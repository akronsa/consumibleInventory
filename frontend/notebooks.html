<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notebooks — Akron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #ED1C24;
      --dark:   #58595B;
      --mid:    #7f8284;
      --light:  #f3f3f3;
      --border: #e0e0e0;
      --white:  #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-weight: 500;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--dark);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-img { height: 36px; width: auto; display: block; }

    .header-title {
      font-size: 14px; font-weight: 600;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* ── Sidebar ── */
    .sidebar {
      position: fixed;
      top: 64px;
      left: 0;
      width: 240px;
      height: calc(100vh - 64px);
      background: #3a3b3d;
      z-index: 90;
      overflow-y: auto;
      transform: translateX(-100%);
      transition: transform .3s ease;
    }

    .sidebar.open { transform: translateX(0); }

    .sidebar-section { padding: 24px 0 8px; }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.3);
      padding: 0 20px 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
      text-decoration: none;
      border-left: 3px solid transparent;
    }

    .sidebar-item:hover { background: rgba(255,255,255,0.07); color: var(--white); }

    .sidebar-item.active {
      color: var(--white);
      border-left-color: var(--red);
      background: rgba(255,255,255,0.05);
    }

    .sidebar-item .item-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 89;
    }

    .sidebar-overlay.visible { display: block; }

    .layout-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: margin-left .3s ease;
      min-width: 0;
    }

    body.sidebar-open .layout-content { margin-left: 240px; }

    .btn-menu {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-right: 16px;
    }

    .btn-menu span {
      display: block;
      width: 22px;
      height: 2px;
      background: rgba(255,255,255,0.8);
      transition: transform .3s ease, opacity .3s ease;
    }

    body.sidebar-open .btn-menu span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    body.sidebar-open .btn-menu span:nth-child(2) { opacity: 0; }
    body.sidebar-open .btn-menu span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 600px) {
      body.sidebar-open .layout-content { margin-left: 0; }
      .sidebar { top: 56px; }
      header { padding: 0 16px; height: 56px; }
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }

    .page-title {
      font-size: 42px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: 16px;
      color: var(--mid);
      margin-bottom: 40px;
    }

    .card {
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 28px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--mid);
      margin-bottom: 14px;
    }

    /* ── Input ── */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      border: 1.5px solid var(--border);
      padding: 12px 44px 12px 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--dark);
      outline: none;
      transition: border-color .2s ease;
      background: var(--white);
    }

    .input-wrap input:focus { border-color: var(--dark); }

    .btn-camera {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--mid);
      display: flex;
      align-items: center;
      transition: color .2s ease;
    }

    .btn-camera:hover { color: var(--red); }
    .btn-camera svg { width: 22px; height: 22px; }

    .spinner {
      display: none;
      position: absolute;
      right: 44px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    .spinner.visible { display: block; }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* ── Product info ── */
    .product-info {
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 14px;
      background: var(--light);
      border-left: 3px solid var(--dark);
    }

    .product-info.visible { display: flex; }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--dark);
    }

    .product-brand {
      font-size: 13px;
      color: var(--mid);
      margin-top: 2px;
    }

    /* ── Company selector ── */
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .btn-company {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--mid);
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
      text-align: center;
    }

    .btn-company:hover { border-color: var(--dark); color: var(--dark); }

    .btn-company.selected {
      border-color: var(--dark);
      background: var(--dark);
      color: var(--white);
    }

    /* ── Action buttons ── */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-action {
      position: relative;
      padding: 14px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity .2s ease, filter .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-action.loading .btn-label { opacity: 0; }
    .btn-action.loading .btn-spinner { display: block; }

    .btn-entry { background: var(--dark); color: var(--white); }
    .btn-entry:not(:disabled):hover { filter: brightness(1.15); }

    .btn-exit { background: var(--white); color: var(--dark); border: 1.5px solid var(--border); }
    .btn-exit:not(:disabled):hover { border-color: var(--dark); }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      position: absolute;
    }

    .btn-exit .btn-spinner {
      border-color: rgba(0,0,0,0.15);
      border-top-color: var(--dark);
    }

    /* ── Message ── */
    .msg-area { margin-top: 12px; min-height: 22px; }

    .msg {
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .msg.visible { display: block; }
    .msg.ok  { color: #2e7d5e; }
    .msg.err { color: var(--red); }
    .msg.info { color: var(--mid); }

    /* ── Stock table ── */
    .stock-section {
      width: 100%;
      max-width: 560px;
      margin-bottom: 40px;
    }

    .stock-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--mid);
      margin-bottom: 12px;
    }

    .stock-empty {
      font-size: 14px;
      color: var(--mid);
      padding: 20px;
      text-align: center;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .stock-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      box-shadow: var(--shadow);
      font-size: 14px;
    }

    .stock-table th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--mid);
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1.5px solid var(--border);
    }

    .stock-table td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--dark);
    }

    .stock-table tr:last-child td { border-bottom: none; }
    .stock-table tr:hover td { background: var(--light); }

    .stock-qty {
      font-weight: 700;
      font-size: 16px;
      text-align: right;
    }

    .stock-qty.low { color: var(--red); }

    /* ── Camera scanner button ── */
    .btn-torch, .btn-switch-cam {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      padding: 4px 8px;
      transition: color .2s ease;
    }

    .btn-torch.visible, .btn-switch-cam.visible { display: flex; align-items: center; }
    .btn-torch.on { color: #f5c542; }
    .btn-torch:hover, .btn-switch-cam:hover { color: var(--white); }
    .btn-torch svg, .btn-switch-cam svg { width: 20px; height: 20px; }

    /* ── Scanner modal ── */
    .scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .scanner-modal.visible { display: flex; }

    .scanner-box {
      background: var(--dark);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
    }

    .scanner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .scanner-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.8);
    }

    .scanner-header-actions { display: flex; align-items: center; gap: 4px; }

    .btn-scanner-close {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      transition: color .2s ease;
    }

    .btn-scanner-close:hover { color: var(--white); }

    .scanner-video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      overflow: hidden;
    }

    #scannerVideo { width: 100%; height: 100%; object-fit: cover; display: block; }

    .scanner-crosshair {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scanner-crosshair::before {
      content: '';
      width: 65%;
      height: 55%;
      border: 2px solid var(--red);
      opacity: 0.85;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.3);
      transition: border-color .2s ease;
    }

    .scanner-crosshair.focusing::before { border-color: #f5c542; }

    .focus-ring {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid #f5c542;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.4);
      transition: opacity .15s ease, transform .3s ease;
    }

    .focus-ring.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .cam-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
      text-align: center;
      padding: 4px 18px 8px;
      text-transform: uppercase;
    }

    .scanner-status {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }

    .scanner-status.ok  { color: #4caf8a; }
    .scanner-status.err { color: var(--red); }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--mid);
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-menu" id="btnMenu" aria-label="Menu"><span></span><span></span><span></span></button>
    <a class="logo" href="#">
      <img class="logo-img" src="/logo.png" alt="Akron" />
    </a>
    <span class="header-title">Gestión de consumibles</span>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Modulos</div>
      <a class="sidebar-item" href="index.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L4 7h16l-4-4z"/></svg>
        Consumibles
      </a>
      <a class="sidebar-item" href="discos.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        Discos
      </a>
      <a class="sidebar-item active" href="notebooks.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Notebooks
      </a>
    </div>
  </nav>

  <div class="layout">
    <div class="layout-content">
  <main>
    <h1 class="page-title">Stock de Notebooks</h1>
    <p class="page-subtitle">Escaneá el equipo y seleccioná la empresa</p>

    <!-- Card: Escaneo -->
    <div class="card">
      <div class="card-label">Código de barras del equipo</div>
      <div class="input-wrap">
        <input id="barcode" type="text" placeholder="Escaneá el código..." autocomplete="off" />
        <div id="spinner" class="spinner"></div>
        <button class="btn-camera" id="btnCamera" type="button" title="Escanear con cámara" aria-label="Escanear con cámara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </div>
      <div class="product-info" id="productInfo">
        <div>
          <div class="product-name" id="productName"></div>
          <div class="product-brand" id="productBrand"></div>
        </div>
      </div>
    </div>

    <!-- Card: Empresa -->
    <div class="card">
      <div class="card-label">Empresa</div>
      <div class="company-grid" id="companyGrid">
        <button class="btn-company" data-company="Akron">Akron</button>
        <button class="btn-company" data-company="Mojon Uno">Mojon Uno</button>
        <button class="btn-company" data-company="Tekron">Tekron</button>
        <button class="btn-company" data-company="Terraplane">Terraplane</button>
        <button class="btn-company" data-company="Fundacion Akron">Fundacion Akron</button>
      </div>

      <div class="msg-area">
        <div id="msg" class="msg"></div>
      </div>

      <div class="action-row">
        <button class="btn-action btn-entry" id="btnEntry" disabled>
          <div class="btn-spinner"></div>
          <span class="btn-label">+ Registrar ingreso</span>
        </button>
        <button class="btn-action btn-exit" id="btnExit" disabled>
          <div class="btn-spinner"></div>
          <span class="btn-label">− Registrar salida</span>
        </button>
      </div>
    </div>

    <!-- Stock general -->
    <div class="stock-section">
      <div class="stock-title">Stock actual</div>
      <div id="stockContainer">
        <div class="stock-empty">Cargando...</div>
      </div>
    </div>
  </main>

  <footer>Akron &copy; 2025 — Sistema interno</footer>

  <!-- Scanner modal -->
  <div class="scanner-modal" id="scannerModal">
    <div class="scanner-box">
      <div class="scanner-header">
        <span class="scanner-title">Escanear código</span>
        <div class="scanner-header-actions">
          <button class="btn-switch-cam" id="btnSwitchCam" type="button" aria-label="Cambiar cámara">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
          </button>
          <button class="btn-torch" id="btnTorch" type="button" aria-label="Linterna">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2h8l1 6H7L8 2z"/><path d="M7 8l-2 14h14L17 8"/><line x1="12" y1="12" x2="12" y2="18"/></svg>
          </button>
          <button class="btn-scanner-close" id="btnScannerClose" type="button" aria-label="Cerrar">&#x2715;</button>
        </div>
      </div>
      <div class="scanner-video-wrap">
        <video id="scannerVideo" autoplay playsinline muted></video>
        <div class="scanner-crosshair" id="scannerCrosshair"></div>
        <div class="focus-ring" id="focusRing"></div>
      </div>
      <div class="cam-label" id="camLabel"></div>
      <div class="scanner-status" id="scannerStatus">Apuntá la cámara al código...</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let currentBarcode = "";
    let currentProduct = null;
    let selectedCompany = null;
    let barcodeDebounce = null;

    // ── Empresa ──
    document.querySelectorAll(".btn-company").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".btn-company").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedCompany = btn.dataset.company;
        updateButtons();
      });
    });

    function updateButtons() {
      const ready = currentProduct && selectedCompany;
      $("btnEntry").disabled = !ready;
      $("btnExit").disabled  = !ready;
    }

    function setMsg(text, cls = "") {
      const el = $("msg");
      if (!text) { el.className = "msg"; el.textContent = ""; return; }
      el.className = `msg visible ${cls}`;
      el.textContent = text;
    }

    function setProduct(product) {
      currentProduct = product;
      const info = $("productInfo");
      if (!product) {
        info.classList.remove("visible");
        $("productName").textContent = "";
        $("productBrand").textContent = "";
      } else {
        $("productName").textContent = product.name;
        $("productBrand").textContent = product.brand || "";
        info.classList.add("visible");
      }
      updateButtons();
    }

    // ── Lookup al escanear ──
    $("barcode").addEventListener("input", () => {
      const code = $("barcode").value.trim();
      currentBarcode = code;
      setProduct(null);
      setMsg("");
      if (code.length < 3) return;

      clearTimeout(barcodeDebounce);
      $("spinner").classList.add("visible");
      barcodeDebounce = setTimeout(async () => {
        try {
          const r = await fetch(`/api/notebooks/lookup/${encodeURIComponent(code)}`);
          const j = await r.json();
          if (r.ok) {
            setProduct(j);
            renderStockForProduct(j.stock || []);
          } else {
            const err = j.detail?.error || j.detail || "Producto no encontrado";
            setMsg(err, "err");
          }
        } catch (e) {
          setMsg("Error de conexión", "err");
        } finally {
          $("spinner").classList.remove("visible");
        }
      }, 200);
    });

    // ── Stock inline del producto escaneado ──
    function renderStockForProduct(stockArr) {
      if (!stockArr.length) return;
      // Actualiza el stock general para reflejar el producto actual
      loadStock();
    }

    // ── Registrar ingreso / salida ──
    async function move(direction) {
      if (!currentProduct || !selectedCompany) return;
      const btnId  = direction === "entry" ? "btnEntry" : "btnExit";
      const btn    = $(btnId);
      btn.disabled = true;
      btn.classList.add("loading");
      setMsg("Procesando...", "info");

      try {
        const r = await fetch(`/api/notebooks/${direction}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ barcode: currentBarcode, company: selectedCompany }),
        });
        const j = await r.json();
        if (!r.ok) {
          const err = j.detail?.error || j.detail || "Error";
          setMsg(err, "err");
        } else {
          const verb = direction === "entry" ? "Ingreso registrado" : "Salida registrada";
          setMsg(`${verb} — ${j.product.name} · ${selectedCompany} · Stock: ${j.quantity}`, "ok");
          loadStock();
          setTimeout(() => { if ($("msg").classList.contains("ok")) setMsg(""); }, 5000);
        }
      } catch (e) {
        setMsg("Error de conexión", "err");
      } finally {
        btn.disabled = !currentProduct || !selectedCompany;
        btn.classList.remove("loading");
      }
    }

    $("btnEntry").addEventListener("click", () => move("entry"));
    $("btnExit").addEventListener("click",  () => move("exit"));

    // ── Stock general ──
    async function loadStock() {
      try {
        const r = await fetch("/api/notebooks/stock");
        if (!r.ok) return;
        const rows = await r.json();
        renderStock(rows);
      } catch (_) {}
    }

    function renderStock(rows) {
      const container = $("stockContainer");
      if (!rows.length) {
        container.innerHTML = '<div class="stock-empty">Sin stock registrado</div>';
        return;
      }
      const html = `
        <table class="stock-table">
          <thead>
            <tr>
              <th>Modelo</th>
              <th>Empresa</th>
              <th style="text-align:right">Stock</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>
                  <div style="font-weight:700">${esc(r.name)}</div>
                  <div style="font-size:12px;color:var(--mid)">${esc(r.brand || "")}</div>
                </td>
                <td>${esc(r.company)}</td>
                <td class="stock-qty${r.quantity <= 1 ? " low" : ""}">${r.quantity}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>`;
      container.innerHTML = html;
    }

    function esc(str) {
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // Desktop: suprimir teclado virtual (escáner físico)
    if (window.matchMedia("(pointer: fine)").matches) {
      $("barcode").setAttribute("inputmode", "none");
    }

    window.addEventListener("load", () => {
      $("barcode").focus();
      loadStock();
    });

    // ── Camera scanner ──
    let mediaStream = null;
    let scanLoopId = null;
    let refocusIntervalId = null;
    let barcodeDetector = null;
    let videoTrack = null;
    let torchOn = false;
    let cameras = [];
    let camIndex = 0;

    function openScanner() {
      $("scannerModal").classList.add("visible");
      $("scannerStatus").className = "scanner-status";
      $("scannerStatus").textContent = "Apuntá la cámara al código...";
      $("btnTorch").classList.remove("visible", "on");
      $("btnSwitchCam").classList.remove("visible");
      $("camLabel").textContent = "";
      torchOn = false;
      startScanner();
    }

    function closeScanner() {
      stopScanner();
      $("scannerModal").classList.remove("visible");
    }

    async function applyFocus(x = 0.5, y = 0.5) {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities?.() || {};
      if (!caps.focusMode) return;
      try {
        $("scannerCrosshair").classList.add("focusing");
        const constraints = { advanced: [{ focusMode: "single-shot" }] };
        if (caps.pointsOfInterest) constraints.advanced[0].pointsOfInterest = [{ x, y }];
        await videoTrack.applyConstraints(constraints);
      } catch (_) {} finally {
        setTimeout(() => $("scannerCrosshair").classList.remove("focusing"), 600);
      }
    }

    async function startScanner(index) {
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      cancelAnimationFrame(scanLoopId);
      clearInterval(refocusIntervalId);

      if (!("BarcodeDetector" in window)) {
        $("scannerStatus").className = "scanner-status err";
        $("scannerStatus").textContent = "Se requiere Chrome actualizado para usar la cámara.";
        return;
      }

      try {
        if (cameras.length === 0) {
          const tmp = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
          tmp.getTracks().forEach(t => t.stop());
          const all = await navigator.mediaDevices.enumerateDevices();
          const allVideo = all.filter(d => d.kind === "videoinput");
          cameras = allVideo.filter(d => !d.label.toLowerCase().includes("front") && !d.label.toLowerCase().includes("facing front"));
          if (cameras.length === 0) cameras = allVideo;

          if (index == null) {
            const savedId = localStorage.getItem("scanner_camera_id");
            const savedIdx = savedId ? cameras.findIndex(c => c.deviceId === savedId) : -1;
            camIndex = savedIdx >= 0 ? savedIdx : 0;
          } else {
            camIndex = index;
          }
        } else {
          camIndex = index ?? camIndex;
        }

        const cam = cameras[camIndex];
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: cam.deviceId }, width: { ideal: 3840 }, height: { ideal: 2160 } }
        });

        const video = $("scannerVideo");
        video.srcObject = mediaStream;
        await video.play();

        videoTrack = mediaStream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities?.() || {};
        localStorage.setItem("scanner_camera_id", cam.deviceId);

        const label = cam.label || `Cámara ${camIndex + 1}`;
        $("camLabel").textContent = `${camIndex + 1} / ${cameras.length} — ${label}`;

        if (cameras.length > 1) $("btnSwitchCam").classList.add("visible");
        if (caps.torch) $("btnTorch").classList.add("visible");
        else $("btnTorch").classList.remove("visible", "on");
        torchOn = false;

        await applyFocus(0.5, 0.5);
        refocusIntervalId = setInterval(() => applyFocus(0.5, 0.5), 2500);

        const cropCanvas = document.createElement("canvas");
        cropCanvas.width = 1024;
        cropCanvas.height = 1024;

        if (!barcodeDetector) {
          const formats = await BarcodeDetector.getSupportedFormats();
          barcodeDetector = new BarcodeDetector({ formats });
        }
        scanLoop(video, cropCanvas);

      } catch (e) {
        $("scannerStatus").className = "scanner-status err";
        if (e.name === "NotAllowedError") $("scannerStatus").textContent = "Permiso de cámara denegado.";
        else if (e.name === "NotFoundError") $("scannerStatus").textContent = "No se encontró ninguna cámara.";
        else $("scannerStatus").textContent = "No se pudo acceder a la cámara.";
        stopScanner();
      }
    }

    $("scannerVideo").addEventListener("click", (e) => {
      if (!videoTrack) return;
      const rect = e.target.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const ring = $("focusRing");
      ring.style.left = `${e.clientX - rect.left}px`;
      ring.style.top  = `${e.clientY - rect.top}px`;
      ring.classList.add("active");
      setTimeout(() => ring.classList.remove("active"), 700);
      applyFocus(x, y);
    });

    function scanLoop(video, cropCanvas) {
      const ctx = cropCanvas.getContext("2d");
      const CROP_W = 0.65;
      const CROP_H = 0.55;

      const tick = async () => {
        if (!barcodeDetector || !mediaStream) return;
        try {
          const vw = video.videoWidth;
          const vh = video.videoHeight;
          if (vw && vh) {
            const sw = vw * CROP_W;
            const sh = vh * CROP_H;
            const sx = (vw - sw) / 2;
            const sy = (vh - sh) / 2;
            ctx.drawImage(video, sx, sy, sw, sh, 0, 0, 1024, 1024);
            const codes = await barcodeDetector.detect(cropCanvas);
            if (codes.length > 0) {
              const code = codes[0].rawValue;
              closeScanner();
              const barcodeEl = $("barcode");
              barcodeEl.value = code;
              barcodeEl.dispatchEvent(new Event("input", { bubbles: true }));
              return;
            }
          }
        } catch (_) {}
        scanLoopId = requestAnimationFrame(tick);
      };
      scanLoopId = requestAnimationFrame(tick);
    }

    function stopScanner() {
      cancelAnimationFrame(scanLoopId);
      clearInterval(refocusIntervalId);
      scanLoopId = null;
      refocusIntervalId = null;
      barcodeDetector = null;
      cameras = [];
      camIndex = 0;
      if (videoTrack && torchOn) {
        videoTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
      }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      $("scannerVideo").srcObject = null;
      videoTrack = null;
      torchOn = false;
    }

    $("btnSwitchCam").addEventListener("click", () => {
      if (cameras.length < 2) return;
      startScanner((camIndex + 1) % cameras.length);
    });

    $("btnTorch").addEventListener("click", async () => {
      if (!videoTrack) return;
      try {
        torchOn = !torchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        $("btnTorch").classList.toggle("on", torchOn);
      } catch (_) { torchOn = !torchOn; }
    });

    $("btnCamera").addEventListener("click", openScanner);
    $("btnScannerClose").addEventListener("click", closeScanner);
    $("scannerModal").addEventListener("click", (e) => {
      if (e.target === $("scannerModal")) closeScanner();
    });

    // ── Sidebar ──
    const btnMenu = $("btnMenu");
    const sidebar = $("sidebar");
    const overlay = $("sidebarOverlay");

    function toggleSidebar() {
      document.body.classList.toggle("sidebar-open");
      sidebar.classList.toggle("open");
      overlay.classList.toggle("visible");
    }

    btnMenu.addEventListener("click", toggleSidebar);
    overlay.addEventListener("click", toggleSidebar);
  </script>
</body>
</html>
