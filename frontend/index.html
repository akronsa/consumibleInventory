<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IT Akron</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #ED1C24;
      --red-dark: #BA1017;
      --dark: #58595B;
      --ink: #2F3031;
      --mid: #7F8284;
      --light: #F4F3F1;
      --white: #FFFFFF;
      --line: rgba(88, 89, 91, 0.12);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.10);
      --hero-shadow: 0 30px 80px rgba(0, 0, 0, 0.14);
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-weight: 500;
      background:
        radial-gradient(circle at top left, rgba(237, 28, 36, 0.10), transparent 32%),
        linear-gradient(180deg, #FAF9F7 0%, var(--light) 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 28px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }

    .logo-img {
      height: 40px;
      width: auto;
      display: block;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-kicker {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--mid);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--dark);
    }

    main {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 28px 56px;
      flex: 1;
    }

    .section-head {
      margin: 8px 0 18px;
    }

    .section-title {
      font-size: 44px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .section-copy {
      font-size: 18px;
      color: var(--mid);
      max-width: 680px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .module-card {
      position: relative;
      overflow: hidden;
      background: var(--white);
      box-shadow: var(--shadow);
      padding: 22px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .module-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 48px rgba(0,0,0,0.14);
    }

    .module-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 5px;
      background: var(--accent, var(--red));
    }

    .module-top {
      display: grid;
      gap: 16px;
    }

    .module-icon {
      width: 54px;
      height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--accent, var(--red)) 12%, white);
      color: var(--accent, var(--red));
    }

    .module-icon svg {
      width: 28px;
      height: 28px;
    }

    .module-name {
      font-size: 30px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--dark);
    }

    .module-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent, var(--red));
    }

    .module-cta svg {
      width: 16px;
      height: 16px;
    }

    footer {
      text-align: center;
      padding: 26px 20px 34px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @media (max-width: 1100px) {
      .module-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      header,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      header {
        padding-top: 18px;
      }

      .module-grid {
        grid-template-columns: 1fr;
      }

      .brand-title {
        font-size: 20px;
      }

      .section-title {
        font-size: 34px;
      }

      .section-copy {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <img class="logo-img" src="/logo.png" alt="Akron" />
      <div class="brand-copy">
        <div class="brand-kicker">Sistema interno</div>
        <div class="brand-title">IT Akron</div>
      </div>
    </a>
  </header>

  <main>
    <section>
      <div class="section-head">
        <div>
          <h2 class="section-title">Módulos</h2>
          <p class="section-copy">Elegí la herramienta que necesitás y entrá directo al flujo correspondiente.</p>
        </div>
      </div>

      <div class="module-grid">
        <a class="module-card" href="consumibles.html" style="--accent:#ED1C24;">
          <div class="module-top">
            <div class="module-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L4 7h16l-4-4z"/></svg>
            </div>
            <div>
              <div class="module-name">Consumibles</div>
            </div>
          </div>
          <div class="module-cta">Abrir módulo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg></div>
        </a>

        <a class="module-card" href="discos.html" style="--accent:#58595B;">
          <div class="module-top">
            <div class="module-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            </div>
            <div>
              <div class="module-name">Discos</div>
            </div>
          </div>
          <div class="module-cta">Abrir módulo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg></div>
        </a>

        <a class="module-card" href="notebooks.html" style="--accent:#8B5E3C;">
          <div class="module-top">
            <div class="module-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            </div>
            <div>
              <div class="module-name">Notebooks</div>
            </div>
          </div>
          <div class="module-cta">Abrir módulo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg></div>
        </a>

        <a class="module-card" href="celulares.html" style="--accent:#3B6E8F;">
          <div class="module-top">
            <div class="module-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            </div>
            <div>
              <div class="module-name">Celulares</div>
            </div>
          </div>
          <div class="module-cta">Abrir módulo <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg></div>
        </a>
      </div>
    </section>
  </main>

  <footer>Akron © 2025 — Sistema interno</footer>
</body>
</html>
