<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inventario — Akron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #ED1C24;
      --dark:   #58595B;
      --mid:    #7f8284;
      --light:  #f3f3f3;
      --border: #e0e0e0;
      --white:  #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-weight: 500;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--dark);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-img { height: 36px; width: auto; display: block; }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .btn-menu {
      background: none; border: none; cursor: pointer;
      padding: 8px; display: flex; flex-direction: column;
      gap: 5px; margin-right: 16px;
    }
    .btn-menu span {
      display: block; width: 22px; height: 2px;
      background: rgba(255,255,255,0.8);
      transition: transform .3s ease, opacity .3s ease;
    }
    body.sidebar-open .btn-menu span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    body.sidebar-open .btn-menu span:nth-child(2) { opacity: 0; }
    body.sidebar-open .btn-menu span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .sidebar {
      width: 240px; background: var(--dark);
      display: flex; flex-direction: column; flex-shrink: 0;
      transform: translateX(-240px); transition: transform .3s ease;
      position: fixed; top: 64px; left: 0; bottom: 0;
      z-index: 90; overflow-y: auto;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-section { padding: 24px 0 8px; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.2em; color: rgba(255,255,255,0.3); padding: 0 20px 8px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; font-size: 15px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.6); cursor: pointer;
      transition: background .2s ease, color .2s ease;
      text-decoration: none; border-left: 3px solid transparent;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.07); color: var(--white); }
    .sidebar-item.active { color: var(--white); border-left-color: var(--red); background: rgba(255,255,255,0.05); }
    .sidebar-item .item-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 89;
    }
    .sidebar-overlay.visible { display: block; }

    .layout { display: flex; flex: 1; overflow: hidden; }
    .layout-content { flex: 1; display: flex; flex-direction: column; transition: margin-left .3s ease; min-width: 0; }
    body.sidebar-open .layout-content { margin-left: 240px; }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 48px 20px; }

    .page-title {
      font-size: 42px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--dark); margin-bottom: 6px; text-align: center;
    }
    .page-subtitle {
      font-size: 16px; font-weight: 500; color: var(--mid);
      text-align: center; margin-bottom: 40px; letter-spacing: 0.03em;
    }

    .placeholder-card {
      background: var(--white); box-shadow: var(--shadow);
      padding: 48px 32px; width: 100%; max-width: 520px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .placeholder-icon { color: var(--border); }
    .placeholder-label {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--mid); text-align: center;
    }

    footer {
      text-align: center; padding: 20px; font-size: 13px;
      font-weight: 500; color: #b1bec5; letter-spacing: 0.05em; text-transform: uppercase;
    }

    @media (max-width: 600px) {
      header { padding: 0 20px; height: 56px; }
      .header-title { display: none; }
      main { padding: 28px 16px; }
      .page-title { font-size: 30px; }
      body.sidebar-open .layout-content { margin-left: 0; }
      .sidebar { top: 56px; }
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-menu" id="btnMenu" aria-label="Menu"><span></span><span></span><span></span></button>
    <a class="logo" href="index.html">
      <img class="logo-img" src="/logo.png" alt="Akron" />
    </a>
    <span class="header-title">Inventario</span>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">Modulos</div>
      <a class="sidebar-item" href="index.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L4 7h16l-4-4z"/></svg>
        Consumibles
      </a>
      <a class="sidebar-item" href="reportes.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17H5a2 2 0 00-2 2v0a2 2 0 002 2h14a2 2 0 002-2v0a2 2 0 00-2-2h-4"/><path d="M12 3v14"/><path d="M8 7l4-4 4 4"/></svg>
        Reportes
      </a>
      <a class="sidebar-item active" href="inventario.html">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Inventario
      </a>
    </div>
  </nav>

  <div class="layout">
    <div class="layout-content">
      <main>
        <h1 class="page-title">Inventario</h1>
        <p class="page-subtitle">Próximamente disponible</p>

        <div class="placeholder-card">
          <svg class="placeholder-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          <div class="placeholder-label">Este módulo está en desarrollo</div>
        </div>
      </main>
      <footer>Akron &copy; 2025 — Sistema interno</footer>
    </div>
  </div>

  <script>
    const btnMenu = document.getElementById('btnMenu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-open');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('visible');
    }
    btnMenu.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);
  </script>
</body>
</html>
