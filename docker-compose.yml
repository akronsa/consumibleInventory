services:
  api:
    build: ./api
    container_name: glpi-consumibles-api
    environment:
      GLPI_BASE_URL: "https://glpi.akron.com.ar"
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:?GLPI_APP_TOKEN not set}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:?GLPI_USER_TOKEN not set}
      API_KEY: ${API_KEY:?API_KEY not set}
      PORT: "3000"
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - glpi_net

  frontend:
    build: ./nginx
    container_name: glpi-consumibles-frontend
    depends_on:
      - api
    environment:
      API_KEY: ${API_KEY:?API_KEY not set}
    ports:
      - "8085:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - glpi_net

networks:
  glpi_net:
    driver: bridge